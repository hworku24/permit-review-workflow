services:
  # PermitFlow's own database.
  # No container_name on either service. A fixed name is global to the Docker daemon, so a
  # container left behind by another checkout of this repo blocks `compose up` here with a
  # name conflict. Letting compose derive the name from the project keeps two checkouts
  # independent.
  permitflow-db:
    image: postgres:16
    environment:
      POSTGRES_DB: permitflow
      POSTGRES_USER: permitflow
      POSTGRES_PASSWORD: permitflow
      # Business day math casts timestamps to dates, so the container clock has to match
      # the department's local calendar. See the header of sql/001_schema.sql.
      TZ: America/New_York
      PGTZ: America/New_York
    ports:
      - "5433:5432"
    volumes:
      - permitflow_data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_views.sql:/docker-entrypoint-initdb.d/002_views.sql:ro
      - ./sql/003_seed.sql:/docker-entrypoint-initdb.d/003_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permitflow -d permitflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The state licensing replica. A separate server on a separate port, because that is
  # what it is in reality and because sharing one server would hide the fact that this is
  # a second connection with its own credentials and its own failure mode.
  licensing-db:
    image: postgres:16
    environment:
      POSTGRES_DB: licensing_replica
      POSTGRES_USER: dpor_admin
      POSTGRES_PASSWORD: dpor_admin
      TZ: America/New_York
      PGTZ: America/New_York
    ports:
      - "5434:5432"
    volumes:
      - licensing_data:/var/lib/postgresql/data
      - ./sql/legacy/001_licensing.sql:/docker-entrypoint-initdb.d/001_licensing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpor_admin -d licensing_replica"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The Spring service that owns the JDBC datasource. Optional locally: the application
  # defaults to the direct connection, and this is only reached when LICENSING_BACKEND=http.
  # Started with the rest so the parity test has something to compare against.
  licensing-verifier:
    build:
      context: ./licensing-verifier
      dockerfile: Dockerfile
    environment:
      LICENSING_DB_JDBC_URL: jdbc:postgresql://licensing-db:5432/licensing_replica
      LICENSING_DB_USER: permitflow_ro
      LICENSING_DB_PASSWORD: readonly
      TZ: America/New_York
    ports:
      - "8082:8082"
    depends_on:
      licensing-db:
        condition: service_healthy

volumes:
  permitflow_data:
  licensing_data:
